<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StoryForge Studio</title><style>
:root{--bg:#100e18;--p:#191624;--line:#393247;--txt:#f6f1ff;--muted:#aaa1b9;--a:#b49aff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px system-ui}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.side{width:230px;background:#14111d;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column}.logo{font-weight:900;letter-spacing:2px;margin:0 8px 28px}.logo b{color:var(--a);font-size:25px}.logo small{display:block;color:var(--muted);font-size:9px;letter-spacing:3px;margin-left:33px}.btn{background:var(--a);color:#171020;border:0;border-radius:8px;padding:11px 15px;font-weight:800}.ghost{background:transparent;color:#e6dcf6;border:1px solid var(--line);border-radius:8px;padding:10px 13px}.new{width:100%;margin-bottom:24px}.label{font-size:10px;letter-spacing:2px;color:#80778f;margin:12px 9px}.nav button{display:block;width:100%;text-align:left;padding:12px;border:0;border-radius:8px;background:none;color:var(--muted);margin:2px 0}.nav button.active,.nav button:hover{background:#302641;color:white}.sidefoot{margin-top:auto;border-top:1px solid var(--line);padding:16px 8px;color:var(--muted);font-size:11px}.main{flex:1;min-width:0}.top{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;color:var(--muted)}.content{max-width:1300px;margin:auto;padding:32px}.head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:24px}.eyebrow{color:var(--a);letter-spacing:2px;font-size:10px;font-weight:800}.head h1{font-size:28px;margin:7px 0}.muted{color:var(--muted);line-height:1.6}.hero,.card,.stat,.project,.empty{background:var(--p);border:1px solid var(--line);border-radius:13px}.hero{padding:30px;background:radial-gradient(ellipse at 85% 20%,#574273,transparent 42%),#211b2d}.hero h2{font-size:28px;margin:8px 0}.hero p{color:#c5bcd1;max-width:560px;line-height:1.6}.stats,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}.stat{padding:16px}.stat small,.project small{color:var(--muted)}.stat strong{display:block;font-size:24px;margin-top:5px}.section{display:flex;justify-content:space-between;align-items:center;margin:28px 0 14px}.project{overflow:hidden;cursor:pointer}.cover{height:105px;display:grid;place-items:center;font-size:40px;background:linear-gradient(130deg,#49375f,#222033)}.project>div:last-child{padding:14px}.project h3{margin:0 0 6px}.empty{text-align:center;padding:45px 20px;color:var(--muted)}.empty h3{color:var(--txt)}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,.8fr);gap:15px}.card{padding:20px;margin-bottom:15px}.card h3{margin:0 0 16px}.field{margin-bottom:14px}.field label{display:block;color:#cfc5dc;font-size:12px;font-weight:700;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;background:#100e17;color:white;border:1px solid var(--line);border-radius:8px;padding:11px;outline:none}.field textarea{min-height:100px;resize:vertical;line-height:1.5}.row{display:flex;gap:10px}.row>*{flex:1}.item{padding:13px;border:1px solid var(--line);border-radius:9px;margin:8px 0;background:#211d2b;cursor:pointer}.item strong{display:block}.item small{color:var(--muted)}.character{background:var(--p);border:1px solid var(--line);border-radius:11px;padding:16px}.portrait{height:90px;border-radius:8px;background:linear-gradient(130deg,#55416e,#242033);display:grid;place-items:center;font-size:35px;margin-bottom:12px}.panels{display:grid;grid-template-columns:1fr 1fr;gap:9px;background:#eee9f4;color:#211b2a;padding:15px;border-radius:8px}.panel{border:2px solid #292431;min-height:145px;padding:8px;display:flex;flex-direction:column;justify-content:space-between}.panel.wide{grid-column:span 2;min-height:170px}.panel textarea{background:white;color:#211b2a;border:1px solid #bbb;padding:7px;width:100%;min-height:50px}.panel input{width:100%;padding:6px}.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:15px}.modal>div{width:min(500px,100%);background:var(--p);border:1px solid var(--line);border-radius:14px;padding:24px}.hide{display:none}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#e9ddff;color:#21152f;padding:11px 16px;border-radius:8px;display:none;font-weight:700}@media(max-width:850px){.side{width:190px}.content{padding:24px}.layout{grid-template-columns:1fr}}@media(max-width:600px){.side{width:64px;padding:15px 7px}.logo{font-size:0;margin:4px}.logo b{font-size:25px}.logo small,.label,.nav .txt,.sidefoot{display:none}.nav button{font-size:0;text-align:center}.nav button:after{content:attr(data-icon);font-size:18px}.new{font-size:0;padding:10px}.new:after{content:'＋';font-size:20px}.top{padding:0 13px}.content{padding:18px 12px}.head{align-items:flex-start;flex-direction:column}.stats,.grid{grid-template-columns:1fr 1fr}.hero{padding:22px}.hero h2{font-size:23px}.row{display:block}}
</style></head><body><div class="shell"><aside class="side"><div class="logo"><b>✦</b> STORYFORGE<small>CREATIVE STUDIO</small></div><button class="btn new" id="new">＋ New project</button><div class="label">WORKSPACE</div><nav class="nav"><button data-v="home" data-icon="▦" class="active">▦ <span class="txt">Dashboard</span></button><button data-v="projects" data-icon="✧">✧ <span class="txt">My stories</span></button><button data-v="characters" data-icon="♙">♙ <span class="txt">Characters</span></button><button data-v="world" data-icon="◈">◈ <span class="txt">World builder</span></button><button data-v="chapters" data-icon="≡">≡ <span class="txt">Chapter writer</span></button><button data-v="comic" data-icon="▤">▤ <span class="txt">Manga &amp; manhwa</span></button><button data-v="library" data-icon="▣">▣ <span class="txt">Library &amp; export</span></button></nav><div class="sidefoot">Your imagination. Your world.</div></aside><main class="main"><header class="top"><span>Workspace / <b id="crumb">Dashboard</b></span><span>Free creative workspace</span></header><div id="view" class="content"></div></main></div>
<div id="modal" class="modal hide"><div><div class="head"><div><div class="eyebrow">START CREATING</div><h2>New story project</h2></div><button class="ghost" id="close">✕</button></div><form id="form"><div class="field"><label>Project title</label><input name="title" required placeholder="The name of your story"></div><div class="row"><div class="field"><label>Format</label><select name="format"><option>Japanese manga</option><option>Korean manhwa</option><option>Novel / screenplay</option></select></div><div class="field"><label>Genre</label><select name="genre"><option>Fantasy</option><option>Action</option><option>Adventure</option><option>Romance</option><option>Mystery</option><option>Drama</option><option>Science fiction</option><option>Horror</option></select></div></div><div class="field"><label>Premise</label><textarea name="premise" placeholder="A one-paragraph story idea..."></textarea></div><button class="btn">Create project →</button></form></div></div><div id="toast" class="toast"></div>
<script>
var $=function(s){return document.querySelector(s)},all=function(s){return Array.prototype.slice.call(document.querySelectorAll(s))},key='storyforge.v1',data=[];try{data=JSON.parse(localStorage.getItem(key)||'[]')}catch(e){}var pid=data[0]?data[0].id:null,view='home',chapterIndex=0,pageIndex=0;
function active(){return data.find(function(x){return x.id===pid})}function save(){localStorage.setItem(key,JSON.stringify(data))}function esc(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function toast(s){var t=$('#toast');t.textContent=s;t.style.display='block';setTimeout(function(){t.style.display='none'},2200)}function dl(n,s,type){var a=document.createElement('a'),u=URL.createObjectURL(new Blob([s],{type:type||'application/json'}));a.href=u;a.download=n;a.click();URL.revokeObjectURL(u)}function head(k,t,d,b){return '<div class="head"><div><div class="eyebrow">'+k+'</div><h1>'+t+'</h1><p class="muted">'+d+'</p></div>'+(b||'')+'</div>'}function empty(t,d){return '<div class="empty"><div style="font-size:35px;color:var(--a)">✧</div><h3>'+t+'</h3><p>'+d+'</p><button class="btn" id="emptyNew">Create project</button></div>'}
function create(f){var p={id:Math.random().toString(36).slice(2),title:f.title,format:f.format,genre:f.genre,premise:f.premise,world:{setting:'',rules:'',history:'',conflicts:''},characters:[],chapters:[],pages:[]};data.unshift(p);pid=p.id;save();$('#modal').classList.add('hide');go('projects');toast('Project created.')}
function card(p){return '<article class="project" data-open="'+p.id+'"><div class="cover">✧</div><div><h3>'+esc(p.title)+'</h3><small>'+esc(p.format)+' · '+esc(p.genre)+'<br>'+p.chapters.length+' chapters · '+p.characters.length+' characters · '+p.pages.length+' pages</small></div></article>'}
function go(v){view=v;all('.nav button').forEach(function(b){b.classList.toggle('active',b.dataset.v===v)});$('#crumb').textContent=({home:'Dashboard',projects:'My stories',characters:'Characters',world:'World builder',chapters:'Chapter writer',comic:'Manga & manhwa',library:'Library & export'})[v];render()}
function render(){var p=active(),o='';
if(view==='home')o=head('YOUR CREATIVE SPACE','Create something unforgettable.','Build an original universe, develop characters and bring your stories to life.','<button class="btn" id="start">＋ New project</button>')+'<div class="hero"><div class="eyebrow">WELCOME TO STORYFORGE</div><h2>Your next favourite story starts here.</h2><p>From the first spark of an idea to a finished manga chapter — shape every detail in one creative studio.</p><button class="ghost" id="hero">Start creating →</button></div><div class="stats"><div class="stat"><small>Projects</small><strong>'+data.length+'</strong></div><div class="stat"><small>Characters</small><strong>'+data.reduce(function(n,x){return n+x.characters.length},0)+'</strong></div><div class="stat"><small>Chapters</small><strong>'+data.reduce(function(n,x){return n+x.chapters.length},0)+'</strong></div></div><div class="section"><h3>Recent stories</h3><button class="ghost" id="seeAll">View all</button></div>'+(data.length?'<div class="grid">'+data.slice(0,3).map(card).join('')+'</div>':empty('Your story universe is waiting','Create a project to begin.'));
if(view==='projects')o=head('PROJECT WORKSPACE','My stories','All your creative projects.','<button class="btn" id="start">＋ New project</button>')+(data.length?'<div class="grid">'+data.map(card).join('')+'</div>':empty('No stories yet','Start your first project.'))+(p?'<div class="section"><h3>Project overview · '+esc(p.title)+'</h3></div><div class="layout"><div class="card"><div class="field"><label>Title</label><input id="title" value="'+esc(p.title)+'"></div><div class="row"><div class="field"><label>Format</label><select id="format">'+['Japanese manga','Korean manhwa','Novel / screenplay'].map(function(x){return '<option '+(p.format===x?'selected':'')+'>'+x+'</option>'}).join('')+'</select></div><div class="field"><label>Genre</label><input id="genre" value="'+esc(p.genre)+'"></div></div><div class="field"><label>Premise</label><textarea id="premise">'+esc(p.premise)+'</textarea></div><button class="btn" id="saveProject">Save changes</button></div><div class="card"><h3>Project tools</h3>'+['characters','world','chapters','comic'].map(function(x){return '<div class="item" data-goto="'+x+'"><strong>'+x+'</strong><small>Open '+x+' workspace →</small></div>'}).join('')+'<button class="ghost" id="delete">Delete project</button></div></div>':'');
if(['characters','world','chapters','comic'].indexOf(view)>=0&&!p)o=head('WORKSPACE',view,'Choose a project to begin.')+empty('Select a project','Create a story or open one in My stories.');
if(view==='characters'&&p)o=head('CAST DEVELOPMENT','Characters · '+esc(p.title),'Create heroes, rivals and supporting cast.','<button class="btn" id="addChar">＋ Add character</button>')+(p.characters.length?'<div class="grid">'+p.characters.map(function(c,i){return '<div class="character"><div class="portrait">♙</div><h3>'+esc(c.name)+'</h3><small>'+esc(c.role)+' · '+esc(c.age)+'</small><p class="muted">'+esc(c.description)+'</p><button class="ghost" data-edit="'+i+'">Edit</button> <button class="ghost" data-remove="'+i+'">Delete</button></div>'}).join('')+'</div>':empty('No characters yet','Add your protagonist, antagonist and supporting cast.'));
if(view==='world'&&p)o=head('WORLD DESIGN','World builder · '+esc(p.title),'Build a setting and rules that stay consistent.')+'<div class="layout"><div class="card">'+[['setting','World / setting','Geography, kingdoms, cities and cultures'],['rules','Magic or power system','Abilities, limits, costs and consequences'],['history','History and lore','Ancient events, myths and important figures'],['conflicts','Central conflicts','Threats, factions and tensions']].map(function(x){return '<div class="field"><label>'+x[1]+'</label><textarea id="'+x[0]+'" placeholder="'+x[2]+'">'+esc(p.world[x[0]])+'</textarea></div>'}).join('')+'<button class="btn" id="saveWorld">Save world bible</button></div><div class="card"><h3>Worldbuilding prompts</h3><p class="muted">What does magic cost? Who controls knowledge? What historical lie does everyone believe?</p></div></div>';
if(view==='chapters'&&p){var ch=p.chapters[chapterIndex]||{title:'Chapter '+(p.chapters.length+1),summary:'',body:''};o=head('MANUSCRIPT','Chapter writer · '+esc(p.title),'Write and organise your story chapters.','<button class="btn" id="newChapter">＋ New chapter</button>')+'<div class="layout"><div class="card"><div class="field"><label>Chapter title</label><input id="chTitle" value="'+esc(ch.title)+'"></div><div class="field"><label>Chapter summary</label><textarea id="chSummary">'+esc(ch.summary)+'</textarea></div><div class="field"><label>Manuscript</label><textarea id="chBody" style="min-height:330px" placeholder="Write your chapter here...">'+esc(ch.body)+'</textarea></div><button class="btn" id="saveChapter">Save chapter</button> <button class="ghost" id="exportChapter">Export text</button></div><div class="card"><h3>Chapters</h3>'+p.chapters.map(function(x,i){return '<div class="item" data-ch="'+i+'"><strong>'+esc(x.title)+'</strong><small>Chapter '+(i+1)+'</small></div>'}).join('')+'</div></div>'}
if(view==='comic'&&p){var pg=p.pages[pageIndex]||{title:'Page '+(pageIndex+1),panels:[{scene:'Opening shot',dialogue:'',wide:true},{scene:'Close-up',dialogue:''},{scene:'Reaction',dialogue:''}]};o=head('VISUAL STORYTELLING','Manga & manhwa · '+esc(p.title),'Design page layouts, panel descriptions and dialogue.','<button class="btn" id="newPage">＋ New page</button>')+'<div class="layout"><div class="card"><div class="field"><label>Page title</label><input id="pgTitle" value="'+esc(pg.title)+'"></div><div class="panels">'+pg.panels.map(function(x,i){return '<div class="panel '+(x.wide?'wide':'')+'"><small>PANEL '+(i+1)+' · <input data-scene="'+i+'" value="'+esc(x.scene)+'"></small><div style="text-align:center;font-size:30px;margin:auto;color:#7e6b91">✧</div><textarea data-dialogue="'+i+'" placeholder="Dialogue / narration">'+esc(x.dialogue)+'</textarea></div>'}).join('')+'</div><p><button class="btn" id="savePage">Save page</button> <button class="ghost" id="addPanel">＋ Add panel</button> <button class="ghost" id="exportPage">Export page</button></p></div><div class="card"><h3>Page manager</h3>'+p.pages.map(function(x,i){return '<div class="item" data-page="'+i+'"><strong>'+esc(x.title)+'</strong><small>Page '+(i+1)+'</small></div>'}).join('')+'<p class="muted">Manga uses right-to-left reading; manhwa is designed for vertical scrolling.</p></div></div>'}
if(view==='library')o=head('YOUR WORK','Library & export','Back up your projects and take your stories with you.')+'<div class="card"><h3>Full project backup</h3><p class="muted">Download your projects as a JSON file or restore a backup.</p><button class="btn" id="backup">Download backup</button> <label class="ghost" for="restore">Import backup</label><input id="restore" type="file" accept="application/json" hidden></div><div class="card"><h3>Project exports</h3>'+data.map(function(x){return '<div class="item"><strong>'+esc(x.title)+'</strong><small>'+x.chapters.length+' chapters · '+x.pages.length+' comic pages</small><button class="ghost" data-export="'+x.id+'">Export JSON</button></div>'}).join('')+'</div>';
$('#view').innerHTML=o;bind()}
function bind(){var el=function(id){return $('#'+id)};['start','hero'].forEach(function(x){if(el(x))el(x).onclick=function(){$('#modal').classList.remove('hide')}});if(el('seeAll'))el('seeAll').onclick=function(){go('projects')};if(el('emptyNew'))el('emptyNew').onclick=function(){$('#modal').classList.remove('hide')};all('[data-open]').forEach(function(x){x.onclick=function(){pid=x.dataset.open;go('projects')}});all('[data-goto]').forEach(function(x){x.onclick=function(){go(x.dataset.goto)}});
if(el('saveProject'))el('saveProject').onclick=function(){var p=active();p.title=el('title').value;p.format=el('format').value;p.genre=el('genre').value;p.premise=el('premise').value;save();render();toast('Project saved.')};if(el('delete'))el('delete').onclick=function(){if(confirm('Delete this project?')){data=data.filter(function(x){return x.id!==pid});pid=data[0]?data[0].id:null;save();render()}};
if(el('addChar'))el('addChar').onclick=function(){editChar(null)};all('[data-edit]').forEach(function(b){b.onclick=function(){editChar(+b.dataset.edit)}});all('[data-remove]').forEach(function(b){b.onclick=function(){active().characters.splice(+b.dataset.remove,1);save();render()}});
if(el('saveWorld'))el('saveWorld').onclick=function(){var p=active();['setting','rules','history','conflicts'].forEach(function(k){p.world[k]=el(k).value});save();toast('World bible saved.')};
if(el('newChapter'))el('newChapter').onclick=function(){var p=active();p.chapters.push({title:'Chapter '+(p.chapters.length+1),summary:'',body:''});chapterIndex=p.chapters.length-1;save();render()};if(el('saveChapter'))el('saveChapter').onclick=function(){active().chapters[chapterIndex]={title:el('chTitle').value,summary:el('chSummary').value,body:el('chBody').value};save();render();toast('Chapter saved.')};if(el('exportChapter'))el('exportChapter').onclick=function(){dl((el('chTitle').value||'chapter')+'.txt',el('chBody').value,'text/plain')};all('[data-ch]').forEach(function(b){b.onclick=function(){chapterIndex=+b.dataset.ch;render()}});
if(el('newPage'))el('newPage').onclick=function(){var p=active();p.pages.push({title:'Page '+(p.pages.length+1),panels:[{scene:'Opening shot',dialogue:'',wide:true},{scene:'Close-up',dialogue:''},{scene:'Reaction',dialogue:''}]});pageIndex=p.pages.length-1;save();render()};if(el('savePage'))el('savePage').onclick=savePage;if(el('addPanel'))el('addPanel').onclick=function(){var p=active(),pg=p.pages[pageIndex]||{title:el('pgTitle').value,panels:[]};pg.panels.push({scene:'New scene',dialogue:''});p.pages[pageIndex]=pg;save();render()};if(el('exportPage'))el('exportPage').onclick=function(){savePage();var p=active().pages[pageIndex];dl(p.title+'.html','<h1>'+esc(p.title)+'</h1>'+p.panels.map(function(x,i){return '<section style="border:2px solid;padding:20px;margin:10px"><b>Panel '+(i+1)+': '+esc(x.scene)+'</b><p>'+esc(x.dialogue)+'</p></section>'}).join(''),'text/html')};all('[data-page]').forEach(function(b){b.onclick=function(){pageIndex=+b.dataset.page;render()}});
if(el('backup'))el('backup').onclick=function(){dl('storyforge-backup.json',JSON.stringify({version:1,projects:data},null,2))};all('[data-export]').forEach(function(b){b.onclick=function(){dl('story-'+b.dataset.export+'.json',JSON.stringify(data.find(function(x){return x.id===b.dataset.export}),null,2))}});if(el('restore'))el('restore').onchange=function(){var f=el('restore').files[0];f.text().then(function(s){var j=JSON.parse(s);data=(j.projects||j).concat(data);save();render();toast('Backup imported.')}).catch(function(){toast('Invalid backup file.')})}}
function editChar(i){var p=active(),c=i===null?{}:p.characters[i],name=prompt('Character name',c.name||'');if(!name)return;var role=prompt('Role',c.role||'Supporting'),age=prompt('Age',c.age||''),description=prompt('Appearance, personality, goals and abilities',c.description||''),v={name:name,role:role,age:age,description:description};if(i===null)p.characters.push(v);else p.characters[i]=v;save();render()}
function savePage(){var p=active();p.pages[pageIndex]={title:$('#pgTitle').value,panels:all('[data-scene]').map(function(x,i){return {scene:x.value,dialogue:$('[data-dialogue="'+i+'"]').value,wide:i===0}})};save();toast('Comic page saved.')}
$('#new').onclick=function(){$('#modal').classList.remove('hide')};$('#close').onclick=function(){$('#modal').classList.add('hide')};$('#form').onsubmit=function(e){e.preventDefault();create(Object.fromEntries(new FormData(e.target)));e.target.reset()};all('.nav button').forEach(function(b){b.onclick=function(){go(b.dataset.v)}});render();
</script></body></html>
